spring.application.name=e-commerce-spring-boot

# Port
server.port=8080

# --- DataSource ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ecommerce_dev}
spring.datasource.username=${DB_USER:dev}
spring.datasource.password=${DB_PASS:dev}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- i18n ---
spring.messages.basename=messages,ValidationMessages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
