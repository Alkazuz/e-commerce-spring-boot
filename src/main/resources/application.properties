spring.application.name=e-commerce-spring-boot
spring.autoconfigure.exclude=io.awspring.cloud.autoconfigure.sqs.SqsAutoConfiguration

# --- Port ---
server.port=8080

# --- DataSource ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ecommerce_dev}
spring.datasource.username=${DB_USER:dev}
spring.datasource.password=${DB_PASS:dev}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA/Hibernate ---
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Flyway ---
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=false

# --- i18n ---
spring.messages.basename=messages,ValidationMessages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# -- Locale ---
spring.web.locale=pt_BR
spring.web.locale-resolver=accept-header

# --- JWT ---
security.jwt.secret-key=${JWT_SECRET:iLCSOccNZIN4mPsrqLKZ16hyKSmN+vxt/lffjtWiInc=}
security.jwt.expiration-time=${JWT_EXP_MINUTES:60}


# --- AWS ---
cloud.aws.region.static=${AWS_REGION:us-east-1}
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID:your_access_key}
cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY:your_secret_key}